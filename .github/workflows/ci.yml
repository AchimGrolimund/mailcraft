# The gates every change must pass: formatting, clippy with warnings as errors, the tests, asset
# attribution, crate layering and the wasm build (`cargo xtask ci`), on the three desktop systems
# (clippy and wasm on Linux only). Changes to documentation alone don't run it; `ci-ok` reports
# on every pull request either way, and is the check that protection of main requires.
name: CI

on:
  push:
    branches: [main]
    paths: ['**', '!docs/**', '!**/*.md', 'ATTRIBUTION.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether a pull request changes anything but documentation (Markdown files and docs/;
  # ATTRIBUTION.md counts as code, since `cargo xtask assets` reads it).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE"...HEAD)
          if printf '%s\n' "$files" | grep -qvE '^docs/|\.md$|^$' || printf '%s\n' "$files" | grep -qx ATTRIBUTION.md; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Windowing and file-dialog headers the desktop app links against.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      # Clippy and the wasm check run on Linux only: wasm is the same from any host, and the
      # tests still build every platform's code.
      - run: cargo xtask ci
        env:
          XTASK_CI_SKIP: ${{ runner.os != 'Linux' && 'clippy,wasm' || '' }}

  # The one check main's protection requires: passes when every platform passed, or when there
  # was nothing but documentation to check.
  ci-ok:
    needs: [changes, ci]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
