[package]
name = "mailcraft-time"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MailCraft dates and times: civil calendar maths, RFC 5322 / ISO 8601 / iCalendar text, the clock and the local offset (wasm-safe)"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock and time zone (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"

[dev-dependencies]
proptest = { workspace = true }
